name: Release

# Push a tag such as v1.1.0 and this builds every platform and publishes a GitHub Release with the downloads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: The tag must match the version in Directory.Build.props
        shell: bash
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Version $version in Directory.Build.props" >&2
            exit 1
          fi
      - run: dotnet test OCnM.sln --configuration Release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          # Built on macOS so the binaries can be (ad-hoc) code signed there.
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: scripts/package.sh "${{ matrix.rid }}" dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/OCnM.App -c Release -r "${{ matrix.rid }}" --self-contained -p:PublishSingleFile=true -o pub
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path pub\ocnm.exe, LICENSE -DestinationPath "dist\ocnm-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ocnm-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum ocnm-* > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "OCnM $version" > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "OCnM ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
